{% extends 'base.html' %}

{% block title %}Sign In — PlantCare AI{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="card card-custom p-4 p-sm-5 bg-white shadow" style="border-radius: 18px; border: 1px solid rgba(46, 125, 50, 0.15);">
                    
                    <!-- Card Header -->
                    <div class="text-center mb-4">
                        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle" 
                             style="width: 52px; height: 52px; background: #e8f5e9; color: #2e7d32; border: 1px solid rgba(46, 125, 50, 0.2);">
                            <i class="bi bi-flower1 fs-3"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
                        <p class="text-muted small mb-0">Sign in to access your diagnostic dashboard</p>
                    </div>

                    <!-- Login Form -->
                    <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                        <!-- Identifier Field -->
                        <div class="mb-3">
                            <label for="identifier" class="form-label fw-semibold small text-dark mb-1">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text"
                                       class="form-control border-start-0"
                                       id="identifier"
                                       name="identifier"
                                       placeholder="e.g. username or email"
                                       required
                                       autofocus
                                       value="{{ request.form.identifier or '' }}">
                            </div>
                        </div>

                        <!-- Password Field with Visibility Toggle -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-dark mb-1">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password"
                                       class="form-control border-start-0 border-end-0"
                                       id="password"
                                       name="password"
                                       placeholder="Enter your password"
                                       required>
                                <button class="btn btn-light border border-start-0 text-muted"
                                        type="button"
                                        id="togglePasswordBtn"
                                        title="Toggle password visibility">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Options Row -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                                <label class="form-check-label small text-muted" for="rememberMe">
                                    Remember me
                                </label>
                            </div>
                            <span class="small text-muted">
                                <i class="bi bi-shield-check text-success me-1"></i>Secure Session
                            </span>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary-green py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </div>
                    </form>

                    <!-- Footer Link -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0">
                            Don't have an account?
                            <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">
                                Sign up &rarr;
                            </a>
                        </p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts_extra %}
<script>
// Password visibility toggle
(function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (toggleBtn && passwordInput && icon) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            icon.classList.toggle('bi-eye', !isPassword);
            icon.classList.toggle('bi-eye-slash', isPassword);
        });
    }
})();
</script>
{% endblock %}
